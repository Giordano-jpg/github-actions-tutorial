name: main-worklfow
env:
  IMAGE_REPOSITORY: giordanofcg/foobar
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  # Run all unit tests.
  run-tests:
    runs-on: ubuntu-latest
    steps:
      # Check out the pull request's source code.
      - name: Check out source code
        uses: actions/checkout@v3
      # Install Go.
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "^1.14"
      - name: Print Go version
        run: go version
      # Run unit tests.
      - name: Run unit tests
        run: go test -v ./...

  # Build and release.
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v3
      - name: Build and push container image
        uses: docker/build-push-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.IMAGE_REPOSITORY }}
          tag_with_ref: true
          tag_with_sha: true

  # Deploy (alternativa sin clúster real accesible desde GitHub).
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs:
      - run-tests
      - build-and-release
    steps:
      - name: Simulated deploy
        run: echo "Deploying app to staging environment"
